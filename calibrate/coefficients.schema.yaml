# Provenance schema for per-metric coefficients.
# metrics.* MUST stay null until a real per-metric fit exists.
# holdout_deltas may record measured fields with fit_prediction null
# (measured-only stub). Do not invent fit_prediction or coefficients.
#
# A coefficients change without a new measurement_sha is rejected (CI).
# Fit is per-metric only. There is no composite-score field on purpose.
# Burst / diagnostics / later-day / second-region must not appear in fit_split.

$schema: https://json-schema.org/draft/2020-12/schema
title: cwm-bench coefficients provenance
type: object
additionalProperties: false
required:
  - measurement_sha
  - fit_split
  - holdout_deltas
  - created_at
  - metrics
$defs:
  measuredFields:
    type: object
    additionalProperties: false
    properties:
      goodput: { type: ["number", "null"] }
      p50: { type: ["number", "null"] }
      p95: { type: ["number", "null"] }
      p99: { type: ["number", "null"] }
      error_rate: { type: ["number", "null"] }
      app_cpu_avg: { type: ["number", "null"] }
      db_cpu: { type: ["number", "null"] }
      db_conn_max: { type: ["number", "null"] }
  holdoutEntry:
    type: object
    additionalProperties: false
    required: [run_id, measured, fit_prediction]
    properties:
      run_id: { type: string, minLength: 1 }
      campaign_id: { type: string, minLength: 1 }
      origin_run_id: { type: string, minLength: 1 }
      measured: { $ref: "#/$defs/measuredFields" }
      fit_prediction:
        description: Null until a per-metric fit exists. Do not invent.
        type: ["object", "null"]
      delta:
        description: Null when fit_prediction is null.
        type: ["object", "null"]
properties:
  measurement_sha:
    description: Git SHA of the campaign whose fit-split runs would produce coefficients. Set on a provenance stub; metrics may still be null.
    type: ["string", "null"]
  fit_split:
    description: Run ids used for the per-metric least-squares fit. Must not include Burst or other holdouts.
    type: ["object", "null"]
    additionalProperties: false
    properties:
      run_ids:
        type: array
        items:
          type: string
    required: [run_ids]
  holdout_deltas:
    description: >
      Per-holdout measured values (Burst, diagnostics, later day, second region).
      Measured-only stubs set fit_prediction and delta to null.
    type: ["object", "null"]
    additionalProperties: false
    required: [burst, later-day, second-region]
    properties:
      burst: { $ref: "#/$defs/holdoutEntry" }
      pool-bound: { $ref: "#/$defs/holdoutEntry" }
      app-bound: { $ref: "#/$defs/holdoutEntry" }
      cpu-only: { $ref: "#/$defs/holdoutEntry" }
      later-day: { $ref: "#/$defs/holdoutEntry" }
      second-region: { $ref: "#/$defs/holdoutEntry" }
  created_at:
    type: ["string", "null"]
  metrics:
    description: Per-metric coefficient objects. Each metric is fit independently. No composite. Null on a provenance stub.
    type: object
    additionalProperties: false
    properties:
      cpu: { type: ["object", "null"] }
      p50: { type: ["object", "null"] }
      p95: { type: ["object", "null"] }
      p99: { type: ["object", "null"] }
      goodput: { type: ["object", "null"] }
      error_by_class: { type: ["object", "null"] }
      connections: { type: ["object", "null"] }
    required:
      - cpu
      - p50
      - p95
      - p99
      - goodput
      - error_by_class
      - connections
